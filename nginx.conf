worker_processes 8;

#log_format main '$time_local - $http_host - $remote_addr - $status "$request" $body_bytes_sent - $http_referer - "$http_user_agent"';

pid nginx/pid;

events {
	multi_accept on;
	worker_connections 1024;
}

http {
	include mime.types;
	default_type application/octet-stream;
	access_log nginx/access.log;

	client_body_temp_path nginx/client_body_temp;
	client_body_in_file_only clean;
	client_max_body_size 2m;
	fastcgi_temp_path nginx/fastcgi_temp;
	proxy_temp_path nginx/proxy_temp;
	scgi_temp_path nginx/scgi_temp;
	uwsgi_temp_path nginx/uwsgi_temp;

	http2 on;
	sendfile on;

	keepalive_timeout 20;
	gzip on;

	log_format fastcgi_timing "time=$upstream_response_time";
	server {
		listen 0.0.0.0:8080;

		root public;

		location = /echo {
			fastcgi_param REQUEST_URI $request_uri;
			fastcgi_param REQUEST_BODY $request_body;
			fastcgi_param REQUEST_BODY_FILE $request_body_file;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_pass unix:fastcgi_sqlite3.sock;
		}

		location = /problems {
			fastcgi_param REQUEST_URI $request_uri;
			fastcgi_param REQUEST_BODY $request_body;
			fastcgi_param REQUEST_BODY_FILE $request_body_file;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_pass unix:fastcgi_sqlite3.sock;
		}

		location = /options {
			fastcgi_param REQUEST_URI $request_uri;
			fastcgi_param REQUEST_BODY $request_body;
			fastcgi_param REQUEST_BODY_FILE $request_body_file;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_pass unix:fastcgi_sqlite3.sock;
		}

		location ~ ^/(people|equipment_type|equipment_vendor|equipment_model|problem_type)$ {
			fastcgi_param REQUEST_URI $request_uri;
			fastcgi_param REQUEST_BODY $request_body;
			fastcgi_param REQUEST_BODY_FILE $request_body_file;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_pass unix:fastcgi_sqlite3.sock;
		}

		location ~ ^/people/[0-9]+$ {
			fastcgi_param REQUEST_URI $request_uri;
			fastcgi_param REQUEST_BODY $request_body;
			fastcgi_param REQUEST_BODY_FILE $request_body_file;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_pass unix:fastcgi_sqlite3.sock;
		}

		location ~ ^/problems/[0-9]+$ {
			fastcgi_param REQUEST_URI $request_uri;
			fastcgi_param REQUEST_BODY $request_body;
			fastcgi_param REQUEST_BODY_FILE $request_body_file;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_pass unix:fastcgi_sqlite3.sock;
		}

		location ~ ^/person/[0-9]+$ {
			try_files /person/detail.html =404;
		}

		location ~ ^/problem/[0-9]+$ {
			try_files /problem_detail.html =404;
		}

		location ~ ^/(person|equipment_type|problem_type|equipment_vendor|equipment_model)$ {
			fastcgi_param REQUEST_URI $request_uri;
			fastcgi_param REQUEST_BODY $request_body;
			fastcgi_param REQUEST_BODY_FILE $request_body_file;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_pass unix:fastcgi_sqlite3.sock;
		}

		location = /favicon.ico {
			return 204;
			access_log off;
			log_not_found off;
		}
	}
}
