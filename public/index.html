<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบตั๋วงานร้านซ่อมคอมพิวเตอร์</title>
  <style>
    table {
      border-collapse: collapse;
    }

    th,
    td {
      border: 3px double black;
      padding: 8px;
    }

    td img {
      max-width: 120px;
      max-height: 120px;
    }

    label,
    input,
    select,
    textarea {
      display: block;
    }
  </style>
</head>

<body>
  <h1>ระบบตั๋วงานร้านซ่อมคอมพิวเตอร์</h1>
  <p class="subtitle">บันทึก ติดตาม และตรวจสอบงานซ่อมหน้าร้าน</p>

  <nav>
    <a href="/person.html">บุคคล</a> |
    <a href="/equipment_type.html">ประเภทอุปกรณ์</a> |
    <a href="/problem_type.html">ประเภทปัญหา</a> |
    <a href="/equipment_vendor.html">ผู้ผลิต</a> |
    <a href="/equipment_model.html">รุ่นอุปกรณ์</a>
  </nav>

  <section class="card">
    <h2>เพิ่มงานซ่อม</h2>
    <form id="ticket-form">
      <label>
        หัวข้องาน*
        <input name="title" required>
      </label>
      <label>
        ลูกค้า*
        <select name="customer" required></select>
      </label>
      <label>
        ผู้รับผิดชอบ*
        <select name="respondent" required></select>
      </label>
      <label>
        ประเภทอุปกรณ์*
        <select name="equipment_type" required></select>
      </label>
      <label>
        ผู้ผลิต*
        <select name="vendor" required></select>
      </label>
      <label>
        รุ่นอุปกรณ์*
        <select name="model" required></select>
      </label>
      <label>
        รหัสประจำเครื่อง
        <input name="serial">
      </label>
      <label>
        ประเภทปัญหา*
        <select name="problem_type" required></select>
      </label>
      <label>
        สถานะ
        <select name="status" required></select>
      </label>
      <label>
        ราคาซ่อม
        <input name="charge" type="number" min="0" step="1">
      </label>
      <label class="wide">
        ระบบปฏิบัติการ
        <input name="os">
      </label>
      <label class="full">
        รายละเอียดปัญหา
        <textarea name="description"></textarea>
      </label>
      <label>
        รูปถ่ายอุปกรณ์*
        <input name="photo" type="file" accept="image/*" required>
      </label>
      <div class="full">
        <button type="submit">บันทึกงานซ่อม</button>
        <button type="reset" class="secondary">ล้างข้อมูล</button>
        <span id="message"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>รายการงานซ่อม</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>รหัส</th>
            <th>รูปถ่าย</th>
            <th>งาน</th>
            <th>ลูกค้า</th>
            <th>อุปกรณ์</th>
            <th>ปัญหา</th>
            <th>สถานะ</th>
            <th>ราคา</th>
          </tr>
        </thead>
        <tbody id="tickets">
          <tr>
            <td colspan="8">กำลังโหลด...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    const form = document.querySelector("#ticket-form");
    const message = document.querySelector("#message");
    const ticketTable = document.querySelector("#tickets");
    const options = {
      equipment_types: [],
      problem_types: [],
      statuses: [],
      people: [],
      vendors: [],
      models: []
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }

    function ticketRow(ticket) {
      const charge = ticket.charge == null
        ? "-"
        : `${Number(ticket.charge).toLocaleString()} บาท`;

      return `
        <tr>
          <td>#${ticket.id}</td>
          <td>${ticket.photo
            ? `<img src="${escapeHtml(ticket.photo)}" alt="รูปถ่ายอุปกรณ์">`
            : "-"}</td>
          <td>${escapeHtml(ticket.title)}<br>
            <small>${escapeHtml(ticket.description)}</small>
          </td>
          <td>${escapeHtml(ticket.customer)}</td>
          <td>
            ${escapeHtml(ticket.equipment_type)} /
            ${escapeHtml(ticket.vendor)} ${escapeHtml(ticket.model)}<br>
            <small>${escapeHtml(ticket.serial)}</small>
          </td>
          <td>${escapeHtml(ticket.problem_type)}</td>
          <td class="status">${escapeHtml(ticket.status)}</td>
          <td>
            ${charge}
            <button class="edit" data-id="${ticket.id}"
                    data-charge="${ticket.charge ?? ""}">แก้ไข</button>
          </td>
        </tr>`;
    }

    function setOptions(selectName, values, label = ({ title }) => title,
                        value = ({ title }) => title) {
      const select = form.elements[selectName];
      const selectedValue = select.value;
      const emptyOption = document.createElement("option");
      emptyOption.value = "";
      emptyOption.textContent = "-- กรุณาเลือก --";
      emptyOption.selected = true;
      emptyOption.disabled = true;
      select.replaceChildren(emptyOption, ...values.map((entry) => {
        const option = document.createElement("option");
        option.value = value(entry);
        option.textContent = label(entry);
        return option;
      }));
      if (values.some((entry) => String(value(entry)) === selectedValue)) {
        select.value = selectedValue;
      }
    }

    function setModelOptions() {
      const vendor = form.elements.vendor.value;
      const type = form.elements.equipment_type.value;
      const selectedModel = form.elements.model.value;
      const models = options.models.filter((model) =>
        model.vendor === vendor && model.equipment_type === type
      );
      setOptions("model", models, ({ title }) => {
        const model = models.find((item) => item.title === title);
        return model ? `${model.title} (${model.vendor})` : title;
      });
      if (models.some(({ title }) => title === selectedModel)) {
        form.elements.model.value = selectedModel;
      }
    }

    async function loadOptions() {
      const response = await fetch("/options");
      if (!response.ok) throw new Error("โหลดตัวเลือกไม่สำเร็จ");
      const result = await response.json();
      options.equipment_types = result.equipment_types;
      options.problem_types = result.problem_types;
      options.statuses = result.statuses;
      options.people = result.people;
      options.vendors = result.vendors;
      options.models = result.models;
      setOptions("customer", options.people, ({ title }) => title,
                 ({ id }) => id);
      setOptions("respondent", options.people, ({ title }) => title,
                 ({ id }) => id);
      setOptions("vendor", options.vendors);
      setOptions("equipment_type", options.equipment_types);
      setOptions("problem_type", options.problem_types);
      setOptions("status", options.statuses);
      setModelOptions();
    }

    async function loadTickets() {
      const response = await fetch("/problems");
      const tickets = await response.json();

      ticketTable.innerHTML = tickets.length
        ? tickets.map(ticketRow).join("")
        : '<tr><td colspan="8">ยังไม่มีงานซ่อม</td></tr>';
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "กำลังบันทึก...";

      const data = new FormData(form);
      for (const name of ["photo"]) {
        const file = data.get(name);
        if (!(file instanceof File) || !file.size) {
          message.textContent = "กรุณาเลือกรูปถ่ายอุปกรณ์";
          return;
        }
        if (file.size > 512 * 1024) {
          message.textContent = "รูปถ่ายต้องมีขนาดไม่เกิน 512 KB";
          return;
        }
        const bytes = new Uint8Array(await file.arrayBuffer());
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        data.set(name, btoa(binary));
      }
      const response = await fetch("/problems", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(data)
      });
      const result = await response.json();

      message.textContent = result.ok
        ? "บันทึกสำเร็จ"
        : [result.error, result.context, result.sqlite_code]
            .filter(Boolean)
            .join(" | ") || "เกิดข้อผิดพลาด";

      if (result.ok) {
        form.reset();
        await loadTickets();
      }
    });
    form.elements.vendor.addEventListener("change", setModelOptions);
    form.elements.equipment_type.addEventListener("change", setModelOptions);

    ticketTable.addEventListener("click", async (event) => {
      if (!event.target.classList.contains("edit")) return;

      const button = event.target;
      const status = prompt(
        `สถานะใหม่ (${options.statuses.map(({ title }) => title).join(" / ")})`
      );
      if (!status) return;

      const charge = prompt("ราคาซ่อม", button.dataset.charge);
      const response = await fetch("/problems", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "update",
          id: button.dataset.id,
          status,
          charge: charge ?? ""
        })
      });
      const result = await response.json();

      if (!result.ok) {
        alert(result.error || "แก้ไขข้อมูลไม่สำเร็จ");
      }
      await loadTickets();
    });

    loadOptions()
      .then(loadTickets)
      .catch((error) => {
        message.textContent = error.message;
      });
  </script>
</body>

</html>
