<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บุคคล</title>
</head>
<body>
  <h1>บุคคล</h1>
  <p><a href="/">กลับหน้าหลัก</a></p>
  <form enctype="multipart/form-data">
    <label>เลขประจำตัวประชาชน*<input name="gov_id" required></label><br>
    <label>ชื่อเต็ม*<input name="name" required></label><br>
    <label>เบอร์โทรศัพท์*<input name="phone" required></label><br>
    <label>อีเมล*<input name="email" type="email" required></label><br>
    <label>ที่อยู่*<input name="address" required></label><br>
    <label>รูปถ่ายใบหน้า*<input name="face" type="file" accept="image/*"
      required></label><br>
    <button>เพิ่มบุคคล</button>
    <span></span>
  </form>
  <h2>รายการบุคคล</h2>
  <table border="1" cellpadding="8">
    <thead><tr><th>เลขประจำตัวประชาชน</th><th>ชื่อ</th>
      <th>เบอร์โทรศัพท์</th><th>อีเมล</th><th>ที่อยู่</th></tr></thead>
    <tbody id="records"><tr><td colspan="5">กำลังโหลด...</td></tr></tbody>
  </table>
  <script src="/add-record.js"></script>
</body>
</html>
