<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายละเอียดงานซ่อม</title>
</head>
<body>
  <p><a href="/">กลับหน้าหลัก</a></p>
  <h1>รายละเอียดงานซ่อม</h1>
  <main id="problem">กำลังโหลด...</main>
  <script>
    const id = location.pathname.split("/").pop();
    const container = document.querySelector("#problem");
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[character]));
    fetch(`/problems/${encodeURIComponent(id)}`)
      .then(async (response) => {
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "โหลดข้อมูลไม่สำเร็จ");
        return result;
      })
      .then((problem) => {
        container.innerHTML = `
          ${problem.photo ? `<img src="${escapeHtml(problem.photo)}"
                               alt="รูปถ่ายอุปกรณ์" width="240">` : ""}
          <dl>
            <dt>หัวข้องาน</dt><dd>${escapeHtml(problem.title)}</dd>
            <dt>รายละเอียด</dt><dd>${escapeHtml(problem.description)}</dd>
            <dt>ลูกค้า</dt><dd><a href="/person/${problem.customer_id}">
              ${escapeHtml(problem.customer)}</a></dd>
            <dt>ผู้รับผิดชอบ</dt><dd><a href="/person/${problem.respondent_id}">
              ${escapeHtml(problem.respondent)}</a></dd>
            <dt>อุปกรณ์</dt><dd>${escapeHtml(problem.equipment_type)} /
              ${escapeHtml(problem.vendor)} ${escapeHtml(problem.model)}</dd>
            <dt>หมายเลขเครื่อง</dt><dd>${escapeHtml(problem.serial)}</dd>
            <dt>ประเภทปัญหา</dt><dd>${escapeHtml(problem.problem_type)}</dd>
            <dt>สถานะ</dt><dd>${escapeHtml(problem.status)}</dd>
            <dt>ระบบปฏิบัติการ</dt><dd>${escapeHtml(problem.os)}</dd>
            <dt>ค่าซ่อม</dt><dd>${problem.charge == null ? "-" :
              escapeHtml(`${problem.charge} บาท`)}</dd>
          </dl>`;
      })
      .catch((error) => { container.textContent = error.message; });
  </script>
</body>
</html>
